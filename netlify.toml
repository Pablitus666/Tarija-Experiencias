# Netlify Configuration — Tarija Experiencias
# Sitio estático profesional listo para producción

[build]
  publish = "."
  command = "echo 'Sitio estático: no se requiere paso de compilación'"
  # Ignorar node_modules del despliegue
  ignore = "git diff --quiet --cached package.json package-lock.json"

[dev]
  port = 5500
  command = "npx live-server --open=index.html --port=5500 --ignore=node_modules"

# ————————————————————————————————————————————————————————————————
# Redirecciones y rutas limpias
# ————————————————————————————————————————————————————————————————

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/experiencias"
  to = "/pages/experiencias.html"
  status = 200

[[redirects]]
  from = "/destinos"
  to = "/pages/destinos.html"
  status = 200

[[redirects]]
  from = "/contacto"
  to = "/pages/contacto.html"
  status = 200

[[redirects]]
  from = "/nosotros"
  to = "/pages/nosotros.html"
  status = 200

[[redirects]]
  from = "/viajeros"
  to = "/pages/viajeros.html"
  status = 200

[[redirects]]
  from = "/proveedores"
  to = "/pages/proveedores.html"
  status = 200

# Ruta de fallback para 404 personalizada
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ————————————————————————————————————————————————————————————————
# Headers de caché para rendimiento (producción)
# ————————————————————————————————————————————————————————————————

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/svg+xml"

[[headers]]
  for = "/images%20utilitarios/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/**/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/pages/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# ————————————————————————————————————————————————————————————————
# Headers de seguridad
# ————————————————————————————————————————————————————————————————

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
